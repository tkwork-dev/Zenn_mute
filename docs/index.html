<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設計書一覧 - Zenn Mute User Alert</title>
  <style>
    :root {
      --primary: #3ea8ff;
      --bg: #fafbfc;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-sub: #4a4a4a;
      --border: #e1e4e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      border-bottom: 3px solid var(--primary);
      padding-bottom: 12px;
      margin-bottom: 32px;
    }
    p {
      color: var(--text-sub);
      margin-bottom: 24px;
    }
    .doc-list {
      list-style: none;
    }
    .doc-list li {
      margin-bottom: 12px;
    }
    .doc-list a {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 24px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .doc-list a:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(62, 168, 255, 0.1);
    }
    .doc-list .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--primary);
    }
    .doc-list .desc {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .version {
      font-size: 12px;
      color: #888;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 Zenn Mute User Alert - 設計書</h1>
    <p>Chrome拡張機能「Zenn Mute User Alert」の設計ドキュメント一覧です。</p>

    <ul class="doc-list">
      <li>
        <a href="./architecture.html">
          <div class="title">アーキテクチャ設計書</div>
          <div class="desc">システム概要、コンポーネント構成、データフロー、ファイル依存関係</div>
        </a>
      </li>
      <li>
        <a href="./data-model.html">
          <div class="title">データモデル設計書</div>
          <div class="desc">ストレージ構造、データ定義、ライフサイクル、バリデーションルール</div>
        </a>
      </li>
      <li>
        <a href="./sequence.html">
          <div class="title">シーケンス図</div>
          <div class="desc">ミュートリスト同期、ユーザー検出・警告、SPA遷移検知の各フロー</div>
        </a>
      </li>
      <li>
        <a href="./state.html">
          <div class="title">状態遷移図</div>
          <div class="desc">拡張機能の全体状態、モーダル状態、スクレイピングのリトライ状態</div>
        </a>
      </li>
    </ul>

    <p class="version">Version 1.1.0</p>
  </div>
</body>
</html>
