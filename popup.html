<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background: #fafafa;
    }

    h1 {
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-section {
      background: #eef7ff;
      border: 1px solid #c8e3ff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .sync-section p {
      font-size: 12px;
      color: #555;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .btn-sync {
      width: 100%;
      padding: 10px;
      background: #3ea8ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-sync:hover {
      background: #2b9cf0;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 16px 0;
    }

    .manual-section h2 {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #3ea8ff;
    }

    .btn-add {
      padding: 8px 16px;
      background: #3ea8ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-add:hover {
      background: #2b9cf0;
    }

    .muted-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
    }

    .muted-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .muted-list li .username {
      color: #333;
      font-weight: 500;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .btn-remove:hover {
      color: #c0392b;
    }

    .empty-message {
      color: #999;
      font-size: 13px;
      text-align: center;
      padding: 20px 0;
    }

    .status {
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }

    .count {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>🔇 Zenn ミュートユーザー</h1>

  <div class="sync-section">
    <p>Zennのミュート設定ページを開いて、ミュートリストを自動取得します。</p>
    <button class="btn-sync" id="sync-btn">ミュート設定ページを開いて同期</button>
  </div>

  <div class="status" id="status"></div>

  <hr class="divider">

  <div class="manual-section">
    <h2>手動で追加</h2>
    <div class="input-group">
      <input type="text" id="username-input" placeholder="ユーザー名（@なし）">
      <button class="btn-add" id="add-btn">追加</button>
    </div>
  </div>

  <p class="count" id="count"></p>
  <ul class="muted-list" id="muted-list"></ul>

  <script src="popup.js"></script>
</body>
</html>
